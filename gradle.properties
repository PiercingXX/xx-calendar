org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Run Kotlin compilation in-process inside the Gradle daemon instead of a
# separate Kotlin compile daemon. The standalone daemon writes a client-marker
# temp file to ~/.local/share/kotlin/daemon/ which is read-only in the build
# sandbox, so daemon mode fails with "Could not connect to Kotlin compile
# daemon" / FileSystemException on any clean compile. In-process mode avoids
# that write entirely and keeps the gate hermetic.
kotlin.compiler.execution.strategy=in-process
